# 법령·고시 자동 감시 (매일 아침 6시 KST)
#
# 하는 일: law-watch/sources.json에 적힌 법령 페이지를 매일 확인해서,
# 내용이 바뀌면 이 저장소에 이슈(알림)를 자동으로 만들어줍니다.
# 사람이 확인해야 할 게 있을 때만 알려주고, 평소엔 조용히 지나갑니다.
#
# 수동으로 지금 당장 돌려보고 싶으면:
#   GitHub 저장소 → Actions 탭 → "법령 자동 감시" → "Run workflow" 클릭

name: 법령 자동 감시

on:
  schedule:
    # UTC 21:00 = 한국시간 다음날 06:00
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 법령 페이지 점검
        id: check
        run: node law-watch/check.mjs

      - name: 변경/오류가 있으면 이슈로 알리기
        if: steps.check.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create law-watch --color FBCA04 --description "법령 자동 감시 알림" 2>/dev/null || true
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          EXISTING=$(gh issue list --label law-watch --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "이미 열린 알림 이슈 #$EXISTING 에 댓글로 추가합니다."
            gh issue comment "$EXISTING" --body-file law-watch/issue-body.md
          else
            gh issue create \
              --title "[법령 감시] $TODAY 확인 필요한 변경이 있습니다" \
              --label law-watch \
              --body-file law-watch/issue-body.md
          fi

      - name: 점검 결과 저장소에 기록
        run: |
          git config user.name "law-watch-bot"
          git config user.email "actions@github.com"
          git add law-watch/status.json law-watch/snapshots
          if git diff --staged --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore(law-watch): $(TZ=Asia/Seoul date +%Y-%m-%d) 자동 점검 결과 갱신"
            git push
          fi
