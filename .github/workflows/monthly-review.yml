# 매월 법령 수동 재확인 알림
#
# 자동 감시(law-watch)가 놓칠 수 있는 것들(지자체가 홈페이지 외 경로로 공고한 경우,
# 감시 대상 페이지 주소가 통째로 바뀐 경우 등)을 사람이 직접 확인하도록
# 매달 체크리스트 이슈를 만들어줍니다.

name: 월간 법령 재확인 알림

on:
  schedule:
    # UTC 22:00 (매월 1일) = 한국시간 매월 2일 07:00
    - cron: "0 22 1 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 체크리스트 이슈 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create monthly-review --color 0E8A16 --description "매월 법령 재확인" 2>/dev/null || true
          MONTH=$(TZ=Asia/Seoul date '+%Y년 %m월')
          gh issue create \
            --title "[월간 점검] ${MONTH} 법령·데이터 재확인" \
            --label monthly-review \
            --body-file .github/monthly-review-template.md
